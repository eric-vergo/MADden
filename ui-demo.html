<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MADden — UI screens</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05080d; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      #ui { position: absolute; inset: 0; }
      #demo-hint {
        position: fixed; right: 10px; top: 10px; z-index: 50;
        font: 10px/1.4 ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.02em; color: #55606f;
        padding: 2px 6px; pointer-events: none;
        white-space: nowrap; overflow: hidden; max-width: 60vw; text-align: right;
      }
      /* Demo chrome only: keep screen headers clear of the shortcut strip. */
      #ui .screen-head { padding-right: 420px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/ui/demo.ts"></script>
  </body>
</html>
